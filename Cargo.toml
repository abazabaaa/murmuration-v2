[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/abazabaaa/murmuration-v2"

[workspace.dependencies]
libm = "0.2"
rand_core = "0.6"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
